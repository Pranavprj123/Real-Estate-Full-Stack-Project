<h2 class="mb-4">Your Listed Properties</h2>

<a href="{% url 'add_property' %}" class="btn btn-success mb-4">+ Add New Property</a>

<div class="row">

    {% for property in properties %}
    <div class="col-md-4 mb-4">
        <div class="card shadow-sm">

            <!-- Display first property image -->
            {% if property.images.first %}
            <img src="{{ property.images.first.image.url }}" class="card-img-top" style="height: 200px; object-fit: cover;">
            {% else %}
            <img src="https://via.placeholder.com/400x250?text=No+Image" class="card-img-top" style="height: 200px; object-fit: cover;">
            {% endif %}

            <div class="card-body">
                <h5 class="card-title">{{ property.title }}</h5>
                <p class="card-text text-muted">{{ property.location }}</p>
                <p class="fw-bold">₹{{ property.price }}</p>

                <div class="d-flex justify-content-between">
    <a href="{% url 'edit_property' property.id %}" class="btn btn-primary btn-sm">Edit</a>
    <a href="{% url 'delete_property' property.id %}" onclick="return confirm('Are you sure you want to delete this property?');" class="btn btn-danger btn-sm">Delete</a>
</div>

            </div>
        </div>
    </div>
    {% empty %}
        <p class="text-center mt-3">You haven't listed any properties yet.</p>
    {% endfor %}

</div>
