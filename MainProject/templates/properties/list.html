{% extends 'base.html' %}
{% block content %}

<h2 class="mt-3">Find a Property</h2>

<form method="get" class="row g-3 my-3">

  <div class="col-md-3">
    <input type="text" name="city" class="form-control" placeholder="City">
  </div>

  <div class="col-md-3">
    <select name="type" class="form-select">
      <option value="">Property Type</option>
      <option value="flat">Flat</option>
      <option value="house">House</option>
      <option value="office">Office</option>
    </select>
  </div>

  <div class="col-md-2">
    <input type="number" name="min_price" class="form-control" placeholder="Min Price">
  </div>

  <div class="col-md-2">
    <input type="number" name="max_price" class="form-control" placeholder="Max Price">
  </div>

  <div class="col-md-2">
    <select name="furnished" class="form-select">
      <option value="">Furnished?</option>
      <option value="yes">Yes</option>
    </select>
  </div>

  <div class="col-12">
    <label>Amenities:</label><br>
    <input type="checkbox" name="amenities" value="parking"> Parking
    <input type="checkbox" name="amenities" value="lift"> Lift
    <input type="checkbox" name="amenities" value="security"> Security
    <input type="checkbox" name="amenities" value="balcony"> Balcony
    <input type="checkbox" name="amenities" value="powerbackup"> Power Backup
  </div>

  <div class="col-12">
    <button class="btn btn-primary">Search</button>
  </div>

</form>

<hr>

<div class="row">
  {% for p in properties %}
  <div class="col-md-4 mb-4">
    <div class="card">
      <img src="{{ p.propertyimage_set.first.image.url }}" class="card-img-top">
      <div class="card-body">
        <h5 class="card-title">{{ p.title }}</h5>
        <p>{{ p.city }} | ₹{{ p.price }}</p>
        <a href="{% url 'property_detail' p.id %}" class="btn btn-success">View Details</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>

{% endblock %}
