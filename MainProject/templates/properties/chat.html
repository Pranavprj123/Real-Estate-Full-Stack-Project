<h3>Chat about: {{ property.name }}</h3>
<h5>Talking with: {{ agent.username }}</h5>
<hr>

<div style="border:1px solid #ccc;padding:10px; height:350px; overflow-y:auto;">
    {% for msg in messages %}
        <p>
            <strong>{{ msg.sender.username }}:</strong> {{ msg.message }}
            <small class="text-muted">{{ msg.timestamp }}</small>
        </p>
    {% endfor %}
</div>

<form method="POST" class="mt-3">
    {% csrf_token %}
    {{ form.message }}
    <button class="btn btn-success mt-2">Send</button>
</form>
