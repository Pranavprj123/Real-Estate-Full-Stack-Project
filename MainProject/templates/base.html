<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RealEstate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">🏠 RealEstate</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'home' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'listings' %}">Properties</a>
        </li>
      </ul>

      {% if user.is_authenticated %}
        <a href="{% url 'user_dashboard' %}" class="btn btn-outline-warning me-2">
    Dashboard
  </a>
        <span class="text-warning fw-semibold me-3">
          Hi, {{ user.username }}
        </span>
        <a href="{% url 'logout_user' %}" class="btn btn-danger">
          Logout
        </a>
      {% else %}
        <a href="{% url 'login_user' %}" class="btn btn-success">
          Login
        </a>
      {% endif %}
    </div>
  </div>
</nav>

<!-- ================= MESSAGES ================= -->
{% if messages %}
<div class="container mt-3">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show auto-dismiss" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endfor %}
</div>
{% endif %}

<!-- ================= PAGE CONTENT ================= -->
<div class="container my-4">
    {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- ================= AUTO DISMISS SCRIPT ================= -->
<script>
    // Auto dismiss alerts after 3 seconds
    setTimeout(function () {
        const alerts = document.querySelectorAll('.auto-dismiss');
        alerts.forEach(function (alert) {
            const bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        });
    }, 3000); // 3000ms = 3 seconds
</script>

</body>
</html>
