{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Real Estate Project{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bg-light">

<div class="d-flex">

  <!-- SIDEBAR -->
  <div class="bg-white border-end" id="sidebar" style="width:250px; height:100vh; position:fixed;">
    <div class="p-4 border-bottom">
      <h4 class="text-primary fw-bold">RealEstate</h4>
    </div>

    <ul class="list-group list-group-flush">
      <a href="/" class="list-group-item list-group-item-action">🏠 Properties</a>
      <a href="{% url 'inbox' %}" class="list-group-item list-group-item-action d-flex justify-content-between">
        💬 Inbox
        {% if unread_count > 0 %}
        <span class="badge bg-danger">{{ unread_count }}</span>
        {% endif %}
      </a>
      <a href="#" class="list-group-item list-group-item-action">📊 Dashboard</a>
      <a href="{% url 'logout' %}" class="list-group-item list-group-item-action text-danger">🚪 Logout</a>
    </ul>

  </div>

  <!-- MAIN CONTENT -->
  <div class="flex-grow-1" style="margin-left:250px;">
    <nav class="navbar navbar-light bg-white shadow-sm px-4">
      <span class="navbar-brand mb-0 h5">Welcome, {{ request.user.username }}</span>
    </nav>

    <div class="p-4">
      {% block content %}
      {% endblock %}
    </div>

  </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
