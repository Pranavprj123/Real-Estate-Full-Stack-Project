{% extends 'base.html' %}
{% block content %}
<style>
    :root {
        --primary-color: #2D3E50;
        --secondary-color: #E8505B;
        --accent-color: #F9A826;
        --success-color: #28A745;
        --light-bg: #F8F9FA;
        --dark-text: #1A1A1A;
        --light-text: #6C757D;
    }

    .login-container {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0;
    }

    .login-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        border: none;
        overflow: hidden;
        max-width: 480px;
        width: 100%;
    }

    .login-header {
        background: linear-gradient(135deg, var(--primary-color) 0%, #1a2634 100%);
        padding: 2.5rem 2rem;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    .login-header::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -20%;
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, rgba(249, 168, 38, 0.15) 0%, transparent 70%);
        border-radius: 50%;
    }

    .login-icon {
        width: 80px;
        height: 80px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1rem;
        font-size: 2.5rem;
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .login-header h3 {
        color: white;
        font-weight: 700;
        font-size: 2rem;
        margin: 0 0 0.5rem 0;
        position: relative;
        z-index: 1;
    }

    .login-header p {
        color: rgba(255, 255, 255, 0.8);
        margin: 0;
        font-size: 1rem;
        position: relative;
        z-index: 1;
    }

    .login-body {
        padding: 2.5rem 2rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        color: var(--primary-color);
        font-weight: 600;
        margin-bottom: 0.5rem;
        display: block;
        font-size: 0.95rem;
    }

    .form-control {
        border: 2px solid #e9ecef;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        transition: all 0.3s ease;
        background-color: #f8f9fa;
    }

    .form-control:focus {
        border-color: var(--accent-color);
        box-shadow: 0 0 0 0.2rem rgba(249, 168, 38, 0.15);
        background-color: white;
        outline: none;
    }

    .input-icon-wrapper {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--light-text);
        font-size: 1.1rem;
    }

    .input-icon-wrapper .form-control {
        padding-left: 2.75rem;
    }

    .btn-login {
        background: linear-gradient(135deg, var(--primary-color) 0%, #1a2634 100%);
        color: white;
        border: none;
        padding: 0.875rem 2rem;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1.05rem;
        transition: all 0.3s ease;
        width: 100%;
        margin-top: 1rem;
        box-shadow: 0 4px 15px rgba(45, 62, 80, 0.3);
    }

    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(45, 62, 80, 0.4);
        background: linear-gradient(135deg, #1a2634 0%, var(--primary-color) 100%);
        color: white;
    }

    .btn-login:active {
        transform: translateY(0);
    }

    .divider {
        text-align: center;
        margin: 1.5rem 0;
        position: relative;
    }

    .divider::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        width: 100%;
        height: 1px;
        background: #e9ecef;
    }

    .divider span {
        background: white;
        padding: 0 1rem;
        color: var(--light-text);
        font-size: 0.9rem;
        position: relative;
        z-index: 1;
    }

    .signup-link {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--light-text);
        font-size: 0.95rem;
    }

    .signup-link a {
        color: var(--secondary-color);
        font-weight: 600;
        text-decoration: none;
        transition: color 0.3s ease;
    }

    .signup-link a:hover {
        color: #d43f49;
        text-decoration: underline;
    }

    .password-toggle {
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--light-text);
        cursor: pointer;
        font-size: 1.1rem;
        padding: 0;
        transition: color 0.3s ease;
    }

    .password-toggle:hover {
        color: var(--primary-color);
    }

    @media (max-width: 576px) {
        .login-container {
            padding: 1rem;
        }

        .login-header {
            padding: 2rem 1.5rem;
        }

        .login-header h3 {
            font-size: 1.75rem;
        }

        .login-body {
            padding: 2rem 1.5rem;
        }
    }
</style>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🔐</div>
            <h3>Welcome Back</h3>
            <p>Login to access your account</p>
        </div>
        
        <div class="login-body">
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">👤</span>
                        <input 
                            type="text" 
                            name="username" 
                            id="username"
                            class="form-control" 
                            placeholder="Enter your username"
                            required
                        >
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">🔒</span>
                        <input 
                            type="password" 
                            name="password" 
                            id="password"
                            class="form-control" 
                            placeholder="Enter your password"
                            required
                        >
                        <button 
                            type="button" 
                            class="password-toggle" 
                            onclick="togglePassword()"
                            aria-label="Toggle password visibility"
                        >
                            <span id="toggleIcon">👁️</span>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-login">
                    Login to Your Account
                </button>
            </form>
            
            <div class="signup-link">
                Don't have an account? <a href="{% url 'register' %}">Sign up here</a>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.textContent = '👁️‍🗨️';
    } else {
        passwordInput.type = 'password';
        toggleIcon.textContent = '👁️';
    }
}
</script>

{% endblock %}
