{% extends 'base.html' %}
{% block content %}
<style>
    :root {
        --primary-color: #2D3E50;
        --secondary-color: #E8505B;
        --accent-color: #F9A826;
        --success-color: #28A745;
        --light-bg: #F8F9FA;
        --dark-text: #1A1A1A;
        --light-text: #6C757D;
    }

    .register-container {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0;
    }

    .register-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        border: none;
        overflow: hidden;
        max-width: 550px;
        width: 100%;
    }

    .register-header {
        background: linear-gradient(135deg, var(--success-color) 0%, #20833A 100%);
        padding: 2.5rem 2rem;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    .register-header::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -20%;
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
        border-radius: 50%;
    }

    .register-header::after {
        content: '';
        position: absolute;
        bottom: -30%;
        left: -10%;
        width: 150px;
        height: 150px;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
        border-radius: 50%;
    }

    .register-icon {
        width: 80px;
        height: 80px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1rem;
        font-size: 2.5rem;
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .register-header h3 {
        color: white;
        font-weight: 700;
        font-size: 2rem;
        margin: 0 0 0.5rem 0;
        position: relative;
        z-index: 1;
    }

    .register-header p {
        color: rgba(255, 255, 255, 0.9);
        margin: 0;
        font-size: 1rem;
        position: relative;
        z-index: 1;
    }

    .register-body {
        padding: 2.5rem 2rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        color: var(--primary-color);
        font-weight: 600;
        margin-bottom: 0.5rem;
        display: block;
        font-size: 0.95rem;
    }

    .form-control {
        border: 2px solid #e9ecef;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        transition: all 0.3s ease;
        background-color: #f8f9fa;
    }

    .form-control:focus {
        border-color: var(--success-color);
        box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.15);
        background-color: white;
        outline: none;
    }

    .input-icon-wrapper {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--light-text);
        font-size: 1.1rem;
    }

    .input-icon-wrapper .form-control {
        padding-left: 2.75rem;
    }

    .password-toggle {
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--light-text);
        cursor: pointer;
        font-size: 1.1rem;
        padding: 0;
        transition: color 0.3s ease;
    }

    .password-toggle:hover {
        color: var(--success-color);
    }

    .btn-register {
        background: linear-gradient(135deg, var(--success-color) 0%, #20833A 100%);
        color: white;
        border: none;
        padding: 0.875rem 2rem;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1.05rem;
        transition: all 0.3s ease;
        width: 100%;
        margin-top: 1rem;
        box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
    }

    .btn-register:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(40, 167, 69, 0.4);
        background: linear-gradient(135deg, #20833A 0%, var(--success-color) 100%);
        color: white;
    }

    .btn-register:active {
        transform: translateY(0);
    }

    .password-strength {
        margin-top: 0.5rem;
        font-size: 0.85rem;
    }

    .strength-bar {
        height: 4px;
        border-radius: 2px;
        background: #e9ecef;
        margin-top: 0.5rem;
        overflow: hidden;
    }

    .strength-bar-fill {
        height: 100%;
        transition: all 0.3s ease;
        border-radius: 2px;
    }

    .login-link {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--light-text);
        font-size: 0.95rem;
    }

    .login-link a {
        color: var(--success-color);
        font-weight: 600;
        text-decoration: none;
        transition: color 0.3s ease;
    }

    .login-link a:hover {
        color: #20833A;
        text-decoration: underline;
    }

    .requirements-list {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 1rem;
        margin-top: 0.5rem;
        font-size: 0.85rem;
    }

    .requirements-list ul {
        margin: 0;
        padding-left: 1.25rem;
        color: var(--light-text);
    }

    .requirements-list li {
        margin-bottom: 0.25rem;
    }

    @media (max-width: 576px) {
        .register-container {
            padding: 1rem;
        }

        .register-header {
            padding: 2rem 1.5rem;
        }

        .register-header h3 {
            font-size: 1.75rem;
        }

        .register-body {
            padding: 2rem 1.5rem;
        }
    }
</style>

<div class="register-container">
    <div class="register-card">
        <div class="register-header">
            <div class="register-icon">✨</div>
            <h3>Create an Account</h3>
            <p>Join us and find your dream property</p>
        </div>
        
        <div class="register-body">
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">👤</span>
                        <input 
                            type="text" 
                            name="username" 
                            id="username"
                            class="form-control" 
                            placeholder="Choose a username"
                            required
                        >
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">📧</span>
                        <input 
                            type="email" 
                            name="email" 
                            id="email"
                            class="form-control" 
                            placeholder="your.email@example.com"
                            required
                        >
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password1">Password</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">🔒</span>
                        <input 
                            type="password" 
                            name="password1" 
                            id="password1"
                            class="form-control" 
                            placeholder="Create a strong password"
                            required
                            oninput="checkPasswordStrength()"
                        >
                        <button 
                            type="button" 
                            class="password-toggle" 
                            onclick="togglePassword('password1', 'toggleIcon1')"
                            aria-label="Toggle password visibility"
                        >
                            <span id="toggleIcon1">👁️</span>
                        </button>
                    </div>
                    <div class="strength-bar">
                        <div class="strength-bar-fill" id="strengthBar"></div>
                    </div>
                    <div class="password-strength" id="strengthText"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password2">Confirm Password</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">🔐</span>
                        <input 
                            type="password" 
                            name="password2" 
                            id="password2"
                            class="form-control" 
                            placeholder="Re-enter your password"
                            required
                            oninput="checkPasswordMatch()"
                        >
                        <button 
                            type="button" 
                            class="password-toggle" 
                            onclick="togglePassword('password2', 'toggleIcon2')"
                            aria-label="Toggle password visibility"
                        >
                            <span id="toggleIcon2">👁️</span>
                        </button>
                    </div>
                    <div class="password-strength" id="matchText"></div>
                </div>
                
                <button type="submit" class="btn btn-register">
                    Create Account
                </button>
            </form>
            
            <div class="login-link">
                Already have an account? <a href="{% url 'login_user' %}">Login here</a>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const passwordInput = document.getElementById(inputId);
    const toggleIcon = document.getElementById(iconId);
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.textContent = '👁️‍🗨️';
    } else {
        passwordInput.type = 'password';
        toggleIcon.textContent = '👁️';
    }
}

function checkPasswordStrength() {
    const password = document.getElementById('password1').value;
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');
    
    let strength = 0;
    let feedback = '';
    
    if (password.length >= 8) strength++;
    if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
    if (password.match(/[0-9]/)) strength++;
    if (password.match(/[^a-zA-Z0-9]/)) strength++;
    
    switch(strength) {
        case 0:
        case 1:
            strengthBar.style.width = '25%';
            strengthBar.style.background = '#dc3545';
            feedback = '⚠️ Weak password';
            break;
        case 2:
            strengthBar.style.width = '50%';
            strengthBar.style.background = '#ffc107';
            feedback = '⚡ Fair password';
            break;
        case 3:
            strengthBar.style.width = '75%';
            strengthBar.style.background = '#17a2b8';
            feedback = '💪 Good password';
            break;
        case 4:
            strengthBar.style.width = '100%';
            strengthBar.style.background = '#28a745';
            feedback = '✅ Strong password';
            break;
    }
    
    strengthText.textContent = password.length > 0 ? feedback : '';
    strengthText.style.color = strengthBar.style.background;
    
    checkPasswordMatch();
}

function checkPasswordMatch() {
    const password1 = document.getElementById('password1').value;
    const password2 = document.getElementById('password2').value;
    const matchText = document.getElementById('matchText');
    
    if (password2.length === 0) {
        matchText.textContent = '';
        return;
    }
    
    if (password1 === password2) {
        matchText.textContent = '✅ Passwords match';
        matchText.style.color = '#28a745';
    } else {
        matchText.textContent = '❌ Passwords do not match';
        matchText.style.color = '#dc3545';
    }
}
</script>

{% endblock %}
